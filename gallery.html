</head>
<body>
	<nav>
		<a href="index.html">Home</a>

	<div class="gallery-heading">
			<button class="btn btn-primary" onclick="showGalleryMessage()">Explore the Gallery</button>

		<div class="title-row">
			<img src="flag.webp" alt="Lesotho Flag" class="flag">
			<div class="heading-text">
			<h1>Discover Lesotho Gallery</h1>
			<p>Explore the natural beauty and attractions of Lesotho.</p>
		</div>
	</div>
</div>

	<h2>Mountain Scenery</h2>
	<div class="container my-4">
		<div class="row">
			<div class="gallery">
			<div class="gallery-item">
				<img src="mountain.jpg" alt="Mountain Scenery in Lesotho">
			</div>
			<div class="gallery-item">
				<img src="sehlabathebe.jpg" alt="Mountain Scenery in Lesotho">
			</div>
			<div class="gallery-item">
				<img src="mountain 2.jpg">
			</div>
			<div class="gallery-item">

			</div>

				<img src="sehlaba.jpg" alt="Mountain Scenery in Lesotho">
			</div>
		</div>
	</div>
</div>

<script>
	function showGalleryMessage(){
		alert("Enjoy the beautiful scenery of Lesotho!");
	}
	const themeToggle = document.getElementById("themeToggle");

themeToggle.addEventListener("click", function() {

    document.body.classList.toggle("dark-mode");

    if (document.body.classList.contains("dark-mode")) {
        themeToggle.innerHTML = "☀️";
        themeToggle.classList.replace("btn-dark", "btn-light");
    } else {
        themeToggle.innerHTML = "🌙";
        themeToggle.classList.replace("btn-light", "btn-dark");
    }

});
</script>
